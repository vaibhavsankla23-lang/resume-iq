version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: resumeiq-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: resumeiq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: resumeiq-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/resumeiq_db
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: resumeiq-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: